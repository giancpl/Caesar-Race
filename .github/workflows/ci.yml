name: Verify Caesar Race
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm run check:containers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
  redis:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: redis-integration
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:redis
        env:
          CAESAR_TEST_REDIS_REST_URL: ${{ secrets.CAESAR_TEST_REDIS_REST_URL }}
          CAESAR_TEST_REDIS_REST_TOKEN: ${{ secrets.CAESAR_TEST_REDIS_REST_TOKEN }}
          CAESAR_REQUIRE_REDIS_TESTS: "1"
